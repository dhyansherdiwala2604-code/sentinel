<!DOCTYPE html>
<html>
<head>
  <title>SENTINEL — Counsellor Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">🛡 SENTINEL</div>
    <h1>Counsellor login</h1>
    <p class="muted">This dashboard is restricted to counsellors and the project team.</p>

    {% if error %}
      <div class="error">Incorrect password. Try again.</div>
    {% endif %}

    <form action="/dashboard-login" method="post">
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Log in</button>
    </form>

    <a class="link" href="/">← Back to report form</a>
  </div>
</body>
</html>
